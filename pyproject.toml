[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-sourcing-agent"
version = "0.1.0"
description = "AI-assisted GTM recruiting sourcing workflow: JD -> ICP -> talent map -> search strategy -> candidate evidence -> prioritization -> screening -> outreach -> funnel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.1.0",  # needs client.messages.parse() structured-output support
    "pydantic>=2.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",  # FastAPI's multipart/form-data (file upload) parsing
    "pypdf>=4.0",  # resume PDF text extraction (Phase 8)
    "python-docx>=1.1",  # resume DOCX text extraction (Phase 8)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[project.scripts]
gtm-sourcing-agent = "gtm_sourcing_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
